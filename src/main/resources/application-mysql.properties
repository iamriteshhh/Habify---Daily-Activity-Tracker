# ==========================================
# Habify MySQL Production Configuration
# Activate with: --spring.profiles.active=mysql
# ==========================================
server.port=${PORT:8080}
 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/habify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable H2 console in MySQL production profile
spring.h2.console.enabled=false

# JPA / Hibernate MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production Security Hardening
habify.jwt.secret=${JWT_SECRET}
habify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://habify.app}
