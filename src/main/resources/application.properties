# ==========================================
# Habify Application Configuration (Phase 1)
# ==========================================
server.port=8080

# Application Name
spring.application.name=Habify - Daily Activity Tracker

# Default Database Configuration (H2 in-memory mode for frictionless testing & development)
spring.datasource.url=jdbc:h2:mem:habifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration (Hibernate manages schema generation automatically)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic schema.sql execution so Hibernate ddl-auto manages entities
spring.sql.init.mode=never

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# JWT Configuration (Ensure high-entropy 256-bit cryptographic key is set via JWT_SECRET in production)
habify.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
habify.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Restrictive CORS Configuration
habify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Frontend Application Base URL (for verification & reset links)
habify.app.base-url=${APP_BASE_URL:http://localhost:8080}

# Logging
logging.level.com.habify=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
